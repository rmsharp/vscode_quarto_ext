# S149 general document-key value validation — VALID fixture (must produce ZERO diagnostics
# from this feature). The FP battery for the COLUMN-0 document surface: valid closed members,
# the YAML boolean spelling TRUE, a numeric accept, a trailing comment, a numeric-member enum,
# YAML node properties (anchor and tag), a YAML null on a null-admitting field, an OPEN key,
# an unknown key (the _quarto.yml top level is an OPEN key set), the key/value-separator form,
# and a multi-line quoted value whose folded mapping-looking lines must never be emitted.
#
# Every SCALAR line here is grounded quarto exit-0 EXCEPT the deliberate safe-FN lock
# (`project: banana`, grounded exit-1): quarto rejects it, but THIS feature stays silent by
# design because `project` is a container NAME, absent from the DOCUMENT field set. So this
# file's contract is "zero of OUR diagnostics", not "renders clean".
#
# The top-level scalar `format:` NAME was ALSO a documented safe-FN lock here until Session 152,
# when Combo 3 shipped its validation (test/fixtures/yaml-project-format-name/, mirroring the
# .qmd surface's S145 predicate). Its `format: banana` row moved there: on THIS surface it is a
# TRUE positive now, not a safe FN, so it no longer belongs in a "zero diagnostics" fixture.
#
# A third reader-driven safe FN worth knowing about is NOT in the file because it needs no
# lock: `code-fold: banana` renders exit 1 but resolves OPEN ({} — no valuesClosed), exactly
# as it already does on the shipped .qmd surface. The reader decides, and both surfaces agree.
title: Some Title
custom-thing: whatever
toc: true
number-sections: TRUE
df-print: kable
fig-width: 6.5
toc-depth: 3 # a trailing comment is stripped before matching
aspectratio: 169
citeproc: &anchored true
code-link: !!bool true
auto-play-media: null
project: banana
# The SEPARATOR lock (plan §2.8, prerequisite P2) at COLUMN 0 — the openest key set there is.
# YAML's key on the next line is `code-copy:`, not `code-copy`, and the top level is an OPEN
# key set, so quarto accepts the odd key and renders exit 0 (grounded single-valued).
# Splitting at the first colon yielded key `code-copy` with the bogus value token `: hover`,
# flagged against code-copy's closed enum: a cardinal-sin false positive.
code-copy:: hover
# The DEFECT-B lock (plan §2.6) — the FP this slice removes. quarto folds all four lines into
# one `description` string and renders exit 0; before the fix, the column-0 branch returned
# before the scanFlow arming, so `page-navigation: banana` was read as a real website child
# and flagged. The final row proves the guard DISARMS: `code-tools` is scanned again.
description: "line one
website:
  page-navigation: banana
  line two"
code-tools: true
# The §9-REVIEW lock (S149). The same fold, but opened on a line this enumerator SKIPS rather
# than emits: `notes:` sits under an UNRECOGNIZED top-level block, so the scope guard used to
# `continue` before the arming and the folded `toc: banana` was read as a real document key.
# quarto folds all three lines into one `custom-block.note` string and renders exit 0.
custom-block:
  note: "line one
toc: banana
  line two"
# …and the second half of that hole: a block-SEQUENCE item whose own scalar is quoted has no
# key/value separator at all, so the separator guard's "no colon ⇒ no value" reasoning did not
# reach it. quarto renders `chapters: ['intro.qmd number-sections: banana']` — one string,
# exit 0, with no `number-sections` key in the document at all.
custom-list:
  - "intro.qmd
number-sections: banana"
fig-height: 4
